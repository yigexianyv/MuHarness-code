id: b16-memory-recall
suite: behavior
title: 相关历史记忆会被读取并使用
why: 召回候选只是线索，必须 memory_read 读全文后再用
tags: [memory, supplement-v2]
setup:
  memories:
    - title: Atlas 项目部署窗口
      summary: Atlas 项目生产部署的约定，使用前读取全文。
      content: Atlas 项目的生产部署只能在每周二和周四 22:00 之后进行，端口固定使用 8443，周五不允许部署。
turns:
  - 根据 Atlas 之前的部署约定，生产环境能在周五部署吗？端口用多少？
checks:
  - no_run_errors: true
  - tool_used: {name: memory_read, success: true}
  - answer_has: {all: ["8443"]}
  - answer_has: {any: [不能, 不可以, 不允许, 禁止]}
